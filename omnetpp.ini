
[General]
network = QAdhocNetwork
sim-time-limit = 99s
total-stack = 7MiB

# ==========================================================
# Mobility Settings
# ==========================================================
*.node[*].mobility.typename = "RandomWaypointMobility"
*.node[*].mobility.speed = uniform(2mps, 6mps)
*.node[*].mobility.waitTime = 0s
*.node[*].mobility.constraintAreaMinX = 0m
*.node[*].mobility.constraintAreaMinY = 0m
*.node[*].mobility.constraintAreaMaxX = 600m
*.node[*].mobility.constraintAreaMaxY = 400m
*.node[*].mobility.constraintAreaMinZ = 0m
*.node[*].mobility.constraintAreaMaxZ = 0m

# ==========================================================
# Q-Routing Protocol Parameters
# ==========================================================
*.node[*].qnode.alpha = 0.2          # Learning rate
*.node[*].qnode.epsilon = 0.1        # Exploration (higher for MANET discovery)
*.node[*].qnode.initialQ = 0.05s     # Initial delay estimate
*.node[*].qnode.neighborTimeout = 5s # Forget neighbors after 5s of silence

# ==========================================================
# Traffic Application Settings
# ==========================================================
*.node[*].app.startTime = uniform(1s, 3s)
*.node[*].app.sendInterval = 0.5s    # More frequent traffic helps RL converge faster
*.node[*].app.dest = -1              # Send to random nodes

# ==========================================================
# Wireless & Radio Medium (INET Standard)
# ==========================================================
*.radioMedium.typename = "UnitDiskRadioMedium"

*.node[*].wlan.typename = "AckingWirelessInterface"
*.node[*].wlan.interfaceTableModule = "^.interfaceTable"
*.node[*].wlan.bitrate = 54Mbps
*.node[*].wlan.mac.useAck = true
*.node[*].wlan.mac.fullDuplex = false

*.node[*].wlan.radio.typename = "UnitDiskRadio"
*.node[*].wlan.radio.transmitter.communicationRange = 250m
*.node[*].wlan.radio.transmitter.interferenceRange = 0m
*.node[*].wlan.radio.transmitter.detectionRange = 0m
*.node[*].wlan.radio.antenna.mobilityModule = "^.^.^.mobility"

# ==========================================================
# Recording (Optional: for analyzing results later)
# ==========================================================
**.deliveredE2EDelay:vector.recordStrategy = vector
**.scalar-recording = true
**.vector-recording = true
